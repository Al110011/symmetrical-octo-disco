<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #solar-clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Source verticale recadrée en paysage : la bande visible est remontée
           pour placer l'éclipse (à ~38 % de la hauteur source) vers le tiers haut. */
        object-position: 50% 42%;
      }
      /* Titre en bas, sur l'herbe, pour ne pas cacher l'éclipse (en haut du cadre). */
      #title {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 360px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 110px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
        color: #f4f4f5;
        font-size: 80px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      }
      /* Fondu au noir sur la fin. */
      #fade-out {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="solar-clip"
        class="clip"
        src="assets/clip-solar.mp4"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <audio
        id="solar-clip-audio"
        src="assets/clip-solar.mp4"
        data-start="0"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":4.3,"v":1},{"t":4.95,"v":0}]}]}'
      ></audio>
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="1">
        Zaragoza Spain solar eclipse
      </h1>
      <div id="fade-out" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 0);
      tl.to("#title", { opacity: 0, duration: 0.5 }, 2.45);
      tl.to("#fade-out", { opacity: 1, duration: 0.6 }, 4.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
